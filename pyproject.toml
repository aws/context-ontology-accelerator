[project]
name = "coa"
# Single source of truth is the repo-root VERSION file. Do not edit by hand —
# bump VERSION and run `make version` (verified by `make lint`).
version = "0.3.10"
description = "Context Ontology Accelerator for AWS"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.0",
    "ruff>=0.8",
    "mypy==1.20.1",
    "types-requests>=2.32.0",
    "types-PyYAML>=6.0",
    "boto3-stubs[bedrock-runtime]>=1.35",
    "moto[dynamodb,sqs]>=5.0",
    # Real-PDF unit tests for the sources preprocessing module (parse + render)
    "pypdfium2>=4.30.0",
    "pillow>=13.0.0",
]

[tool.uv]
# uv < 0.13.4 embeds roots that trust the compromised eMudhra/emSign intermediates
# (GHSA-hq85-5cpj-mr62); refuse to run with an older uv instead of fetching wheels with it.
required-version = ">=0.13.4"
# Pin transitive dependencies up to the patched floor for security advisories
# in packages nothing here declares directly. The serve image installs from
# uv.lock, so these floors reach it as well as dev/test tooling.
#   werkzeug: pulled by moto (AWS mocking, dev group only). CVE-2026-102598
#   (<3.1.9) — not in any runtime/deploy path, constrained here to clear the
#   Dependabot HIGH alert without widening moto's own range.
#   fsspec: pulled by huggingface-hub / llama-index-core. <2026.6.0 ships an
#   un-sandboxed Jinja2 render in ReferenceFileSystem (Kerchunk) — SSTI/RCE on
#   attacker-controlled references JSON (GHSA, HIGH). 2026.6.0 is the patched
#   floor; constrained here since fsspec is transitive, not directly declared.
#   filelock: pulled by huggingface-hub (via tokenizers). 3.20.4-4.2.0 let a
#   local user who can write the lock directory redirect ReadWriteLock's SQLite
#   onto other files (GHSA-v4x8-3wr5-3wq8, HIGH). 4.2.1 is the patched floor.
#   aiohttp: pulled by llama-index-core and opensearch-py[async] into the serve
#   image. <3.14.4 lets multipart requests exhaust file descriptors and has no
#   initial request/header timeout (GHSA-9xw5-w5jj-pvcg, GHSA-2g87-pp6c-29x5,
#   CVE-2026-111064, HIGH). 3.14.4 is the patched floor.
#   pyasn1: pulled by google-auth (via pyasn1-modules). <0.6.5 has quadratic-time
#   BER/CER/DER decoding of constructed and REAL values (GHSA-mm57-4v3p-rchx,
#   GHSA-9m75-vc3g-4x39, CVE-2026-119194/119196, HIGH). 0.6.5 is the patched floor.
#   multidict: pulled by aiohttp and yarl. 6.7.0-6.9.0 leak references in the
#   items-view union and subtraction of CIMultiDict/MultiDict (GHSA-54p9-h82j-f925,
#   CVE-2026-104874, MEDIUM). 6.9.1 is the patched floor.
#   tinytag: pulled by llama-index-core. 2.0.0-2.2.x loop forever on some M4A
#   files with invalid atoms (GHSA-24cc-9352-h2pg, CVE-2026-104266, MEDIUM).
#   2.3.0 is the patched floor.
constraint-dependencies = [
    "werkzeug>=3.1.9",
    "fsspec>=2026.6.0",
    "filelock>=4.2.1",
    "aiohttp>=3.14.4",
    "pyasn1>=0.6.5",
    "multidict>=6.9.1",
    "tinytag>=2.3.0",
]

[tool.uv.workspace]
members = [
    "packages/control-plane",
    "packages/context-manager",
    "packages/data-layer",
    "packages/ontology-engine",
    "packages/metric-service",
    "packages/vkg",
    "packages/mcp-server",
    "packages/sources",
    "coa-ai/workflow-agents",
    "libs/common",
    "smithy-generated/control-plane-python-server",
    "smithy-generated/data-layer-python-server",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
    "security: Security integration tests (authentication, authorization, input validation, SQL firewall)",
    "slow: Billable load-test rungs (500+) — manual only",
    # Also registered in packages/sources/pyproject.toml, which is the rootdir nx
    # uses. Declared here too so running the trees together (a common local
    # invocation) does not warn about an unknown mark.
    "real_glue_ownership: Opt out of the sources conftest's Glue ownership stub and exercise the real check",
    "batch_inference: Runs a real Bedrock batch job; CI runs it in its own jobs, integ-test-sources-batch and integ-test-beta-batch",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
# Print a traceback on mypy internal errors so transient crashes (e.g. under
# concurrent `nx run-many` lint) are diagnosable instead of just emitting the
# generic "INTERNAL ERROR" banner with no location.
show_traceback = true

[tool.coverage.run]
source = ["packages", "libs"]
omit = [
    "**/tests/**",
    "**/__pycache__/**",
    "**/demo/**",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"
