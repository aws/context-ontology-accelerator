packages:
  - "libs/ts-shared"
  - "packages/web-app"
  - "packages/mcp-proxy"
  - "infra"
  - "tests/cdk"
  - "smithy-generated/control-plane-typescript-client"
  - "smithy-generated/data-layer-typescript-client"
allowBuilds:
  esbuild: true
  nx: true

# Supply chain hardening — prevent exotic subdependency installs and silent downgrades.
# All three are TOP-LEVEL pnpm-workspace.yaml settings. They were previously nested
# under `packageManagerStrictness:` / `pnpm: auditConfig:`, neither of which pnpm
# recognises — and pnpm ignores unknown keys without warning, so all three were dead
# config. Do not re-nest them.
blockExoticSubdeps: true
trustPolicy: no-downgrade
# These exact versions predate the policy activation and are pinned by the
# committed lockfile. pnpm 11+ audits frozen lockfiles and reports them as trust
# downgrades because their registry evidence is weaker than an earlier publish.
# Keep the exceptions version-scoped so upgrades are evaluated normally.
trustPolicyExclude:
  - pnpm@10.34.5
  - semver@6.3.1
  - undici-types@6.21.0

# Quarantine newly-published packages for 7 days before allowing install.
# The unit is MINUTES as a number (7 * 24 * 60). A duration string like "7 days" is
# Renovate's format (see renovate.json), not pnpm's: it parses to NaN here, which
# fails closed and rejects every package including decade-old ones.
minimumReleaseAge: 10080

overrides:
  # downlevel-dts depends on typescript@"next" — a dist-tag that resolves to
  # whatever nightly was published that day. So `pnpm install` pulls a build that
  # is hours old, and the minimumReleaseAge quarantine above then rejects the lockfile
  # it just produced. This is not a stale lockfile: re-resolving reproduces it,
  # because the tag keeps moving. A fresh clone fails `make setup` outright, with
  # node_modules left empty and every TS target (CDK, web-app, Nx) unusable.
  #
  # Scoped to downlevel-dts rather than overriding typescript globally: the
  # workspace packages pin real ranges (~5.7.0 for infra, ^5.6.0 for web-app and
  # ts-shared, ^6.0.3 for mcp-proxy) and a blanket override would drag them all
  # onto one version. downlevel-dts only rewrites .d.ts files for older
  # consumers — a build-time tool inside the Smithy-generated clients, not
  # something whose exact compiler version changes what ships.
  "downlevel-dts>typescript": 6.0.3
  axios: 1.18.0
  "brace-expansion@1.1.14": 1.1.18
  "brace-expansion@2.1.0": 2.1.4
  "brace-expansion@5.0.6": 5.0.9
  fast-xml-builder: 1.1.7
  form-data: 4.0.6
  js-yaml: 3.15.2
  minimatch@9.0.3: 9.0.7
  postcss: 8.5.23
  react-router: 6.30.6
  react-router-dom: 6.30.6
  tmp: 0.2.7
  vite: 6.4.3
  ws: 8.21.0
  # Dependabot CVE transitive bumps (upgrade-only; scoped to avoid cross-major downgrades)
  nanoid@3: 3.3.19
  browserslist: 4.28.8
  baseline-browser-mapping: 2.11.19
  "@babel/core": 7.29.7
