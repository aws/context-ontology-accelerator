[project]
name = "coa-serve"
version = "0.3.2"
description = "Serve layer Context Manager — query orchestration"
requires-python = ">=3.12"

dependencies = [
    "coa-common",
    # Unicode extended grapheme clusters (UAX #29) for multilingual query tokenization.
    "regex==2026.5.9",
    "bedrock-agentcore==1.18.1",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "boto3>=1.35",
    "python-ulid>=3.0.0",
    "structlog>=24.0",
    "pydantic>=2.13.4",
    "PyJWT>=2.13.0",
    "strands-agents>=1.19.0",
    "opensearch-py>=2.5",
    "requests-aws4auth>=1.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    # Direct-JDBC serve executors for additional engines (see clients/db_adapters):
    # MySQL over the pure-Python async aiomysql driver; SQL Server over the
    # pure-Python python-tds driver (run in a threadpool — no native ODBC needed,
    # mirrors the discovery-side SqlServerDialect).
    "aiomysql>=0.2",
    "python-tds>=1.15",
    "sqlglot>=25.0",
    "botocore>=1.35",
    "rdflib>=7.0",
    # real Cedar policy engine for serve-path namespace authorization
    # (same engine the control-plane authorizer uses). arm64 manylinux wheel
    # exists for cp312, so it installs in the AgentCore serve container.
    "cedarpy>=4.8.0",
    # graphrag-lexical-graph — required for the lexical-baseline Tier 3 strategy.
    "graphrag-lexical-graph==3.18.7",
    # Required by graphrag's lexical-baseline retriever (traversal / topic-beam-chunk_only
    # strategies) to build its OpenSearch vector store via LlamaIndex. graphrag treats the
    # OpenSearch backend as an optional extra, so it is NOT pulled in transitively; without
    # it the toolkit raises ImportError ("opensearch-py and/or
    # llama-index-vector-stores-opensearch packages not found") at engine-build time.
    "llama-index-vector-stores-opensearch>=0.5",
    "retryhttp>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_serve"]
# ship the vendored Cedar schema + seed policy files (non-.py data) so
# the engine can read them at runtime inside the container.
artifacts = [
    "src/coa_serve/authz/cedar-schema.json",
    "src/coa_serve/authz/seed/*.cedar",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
    # Mutates authorization state that is AMBIENT to the whole suite — the integ
    # user's grants — rather than state scoped to the test. Such a test cannot
    # run concurrently with any test that queries the same namespace, so the CI
    # job runs these serially in a second phase. See ci/mainline.yml
    # (integ-test-context-manager) and tests/unit/test_integ_parallel_safety.py.
    "mutates_ambient_authz: Serialize — mutates the integ user's grants",
]

[tool.uv.sources]
coa-common = { workspace = true }
