[project]
name = "coa-data-layer"
version = "0.3.10"
description = "Data Layer for Context Ontology Accelerator"
requires-python = ">=3.12"

dependencies = [
    "coa-common",
    "boto3>=1.35.0",
    "botocore>=1.35.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_data_layer"]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
]

[tool.uv.sources]
coa-common = { workspace = true }
