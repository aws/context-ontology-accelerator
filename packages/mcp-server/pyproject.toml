[project]
name = "coa-mcp"
version = "0.2.3"
description = "MCP Server for Context Ontology Accelerator — 6 tools (2 discovery + 4 execution)"
requires-python = ">=3.12"

dependencies = [
    "coa-common",
    "coa-serve",
    "mcp>=1.28.1,<2",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic>=2.13.4",
    "structlog>=24.0",
    "PyJWT>=2.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
]

[tool.uv.sources]
coa-common = { workspace = true }
coa-serve = { workspace = true }
