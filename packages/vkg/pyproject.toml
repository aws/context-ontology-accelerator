[project]
name = "coa-vkg"
version = "0.3.10"
description = "Virtual Knowledge Graph for Context Ontology Accelerator"
requires-python = ">=3.12"

dependencies = [
    "coa-common",
    # Runtime deps imported by translate-server.py (the container installs from requirements.txt).
    "sqlglot>=20.0.0",
    "rdflib>=7.0.0",
    # 2026.10.19 is the first certifi bundle without the roots behind the compromised
    # emSign intermediates. botocore also uses certifi's bundle over its own when installed.
    "certifi>=2026.10.19",
]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
]

[tool.uv.sources]
coa-common = { workspace = true }
