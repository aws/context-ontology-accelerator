[project]
name = "coa-vkg"
version = "0.3.4"
description = "Virtual Knowledge Graph for Context Ontology Accelerator"
requires-python = ">=3.12"

dependencies = [
    "coa-common",
    # Runtime deps imported by translate-server.py. Kept in sync with
    # requirements.txt (the container install manifest); declared here so the
    # uv workspace env — and the unit tests that import translate-server.py —
    # resolve them like any other package dependency.
    "sqlglot>=20.0.0",
    "rdflib>=7.0.0",
]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
]

[tool.uv.sources]
coa-common = { workspace = true }
