# OSI v1.0 — Sample import YAML for the Context Ontology Accelerator
#
# This file demonstrates the expected format for the POST /namespaces/{ns}/import-osi endpoint.
# The YAML content is passed in the request body as: { "content": "<yaml-string>" }
#
# Dialect mapping (OSI → internal):
#   ANSI_SQL   → POSTGRESQL (default)
#   SNOWFLAKE  → SNOWFLAKE
#   DATABRICKS → DATABRICKS
#
# ai_context is a structured object per OSI spec (not a flat string):
#   synonyms: list of alternative names
#   instructions: free-text guidance for AI agents
#   examples: list of example queries/questions
#
# COA-specific metadata travels in the OSI-standard `custom_extensions` list,
# under `vendor_name: COA`. Vendor-prefixed top-level keys such as `x_coa:` are
# NOT part of the OSI spec and are ignored by the importer.
#   data_source_id:    onboarded data source the metric is bound to (required)
#   source_table:      table the expression is evaluated against (required)
#   unit:              display unit (e.g. USD)
#   return_type:       scalar type of the result (e.g. decimal, integer)
#   time_dimension:    default time grain — one of day, week, month, quarter, year
#   ontology_concepts: ontology classes this metric governs (drives Check 6)

osi_spec_version: "1.0"

datasets:
  - name: public.orders
    data_source_id: ds-warehouse-prod
    description: "Production orders table in the data warehouse"
    synonyms:
      - sales_orders
      - order_history

  - name: public.customers
    data_source_id: ds-warehouse-prod
    description: "Customer master data"

metrics:
  - name: total_revenue
    description: "Total revenue from completed orders, excluding refunds"
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: "SELECT SUM(CASE WHEN status = 'completed' THEN amount ELSE 0 END) FROM public.orders"
        - dialect: SNOWFLAKE
          expression: "SELECT SUM(IFF(status = 'completed', amount, 0)) FROM public.orders"
    ai_context:
      synonyms:
        - "total sales"
        - "gross revenue"
        - "income"
      instructions: "Use this metric when the user asks about revenue, sales totals, or income. Excludes cancelled and refunded orders."
      examples:
        - "What was our total revenue last quarter?"
        - "Show me revenue by region"
    custom_extensions:
      - vendor_name: COA
        data:
          data_source_id: ds-warehouse-prod
          source_table: public.orders
          unit: USD
          return_type: decimal
          time_dimension: month
          ontology_concepts:
            - Revenue
            - FinancialMetric

  - name: active_customers
    description: "Count of customers with at least one order in the last 90 days"
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: "SELECT COUNT(DISTINCT customer_id) FROM public.customers WHERE last_order_date >= CURRENT_DATE - INTERVAL '90 days'"
    ai_context:
      synonyms:
        - "engaged customers"
        - "active users"
      instructions: "Use for questions about customer engagement, active user counts, or retention."
    custom_extensions:
      - vendor_name: COA
        data:
          data_source_id: ds-warehouse-prod
          source_table: public.customers
          return_type: integer
          ontology_concepts:
            - CustomerEngagement

  - name: avg_order_value
    description: "Average order value for completed orders"
    expression:
      dialects:
        - dialect: ANSI_SQL
          expression: "SELECT AVG(amount) FILTER (WHERE status = 'completed') FROM public.orders"
        - dialect: DATABRICKS
          expression: "SELECT AVG(CASE WHEN status = 'completed' THEN amount END) FROM public.orders"
    ai_context:
      synonyms:
        - "AOV"
        - "average basket size"
    custom_extensions:
      - vendor_name: COA
        data:
          data_source_id: ds-warehouse-prod
          source_table: public.orders
          unit: USD
          return_type: decimal
