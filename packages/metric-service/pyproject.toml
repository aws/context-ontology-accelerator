[project]
name = "coa-metrics"
version = "0.3.3"
description = "Metric Service for Context Ontology Accelerator"
requires-python = ">=3.12"

dependencies = [
    "coa-common",
    "coa-control-plane-server",
    "httpx>=0.27",
    "boto3>=1.34",
    "structlog>=24.0",
    "opensearch-py>=2.4",
    "requests-aws4auth>=1.2",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_metrics"]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
]
pythonpath = ["src"]

[tool.uv.sources]
coa-common = { workspace = true }
coa-control-plane-server = { workspace = true }
