[project]
name = "coa-control-plane"
version = "0.3.3"
description = "Control Plane for Context Ontology Accelerator"
requires-python = ">=3.12"

dependencies = [
    "coa-common",
    "coa-control-plane-server",
    "cedarpy>=4.8.0",
    "boto3>=1.35.0",
    "mypy-boto3-datazone>=1.35.0",
    "pydantic>=2.13.4",
    "structlog>=24.0",
    "opensearch-py>=2.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_control_plane"]

[tool.pytest.ini_options]
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
]

[tool.uv.sources]
coa-common = { workspace = true }
coa-control-plane-server = { workspace = true }
