packages:
  - "cdk-toolkit"
  - "*/cdk"

# Security overrides for transitive dev/test dependencies (jest/ts-jest toolchain).
# Range-scoped so each major stays on its own line and a blanket pin can't cross
# majors. These projects are customer-facing CDK samples copied out and built on
# their own, so the pins travel with the sample.
overrides:
  # brace-expansion ReDoS (GHSA, HIGH/MODERATE). Patched floors: v1 >=1.1.20,
  # v2 >=2.1.4. Transitive via jest's micromatch. Same majors.
  "brace-expansion@<1.1.20": 1.1.21
  "brace-expansion@>=2.0.0 <2.1.4": 2.1.7
  # handlebars <4.7.10 — critical RCE (GHSA-p8wg-vrv2-v86f, GHSA-8r5x-fm3f-whwj); via ts-jest.
  "handlebars@<4.7.10": 4.7.10
  # sprintf-js <=1.1.3 — DoS via unbounded padding (GHSA-hp3w-g68c-fv3c), no patched
  # release. Its only path is js-yaml 3 -> argparse 1, and js-yaml loads argparse
  # solely from its CLI (bin/js-yaml.js), which nothing here runs; the library that
  # jest/istanbul use never imports it. argparse 2 has no dependencies, so pinning it
  # removes sprintf-js from the tree without touching js-yaml's library code.
  "argparse@<2.0.0": 2.0.1
