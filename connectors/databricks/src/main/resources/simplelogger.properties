#
# Levels for slf4j-simple, which is the connector's SLF4J provider.
#
# Without a provider on the classpath, SLF4J prints "No SLF4J providers were found" once per
# container and discards every log line from the connector AND from the federation SDK. So adding
# the binding is a prerequisite for operating this thing at all.
#
# It is also a data-exposure change, which is why these levels are pinned rather than left at
# slf4j-simple's defaults. This file is the only place they can be pinned: the CDK construct owns
# JAVA_TOOL_OPTIONS outright and refuses a stack that sets it, so a -D property on the command line
# is not available.

# Connector code. INFO is one cold-start line naming the endpoint, and one row count per read.
org.slf4j.simpleLogger.defaultLogLevel=info

# The federation SDK, at WARN.
#
# Its request logging is verbose and, more to the point, carries constraint and predicate literals
# derived from the user's question - a WHERE clause's values, an IN list, the generated SQL. Log
# group retention is one month, so that is a month of question content in CloudWatch for no
# operational benefit. WARN keeps the failures and drops the payloads.
#
# This also covers athena-jdbc's JdbcSplitQueryBuilder, which logs every generated statement at
# INFO, and its JdbcRecordHandler, which logs the split's properties.
org.slf4j.simpleLogger.log.com.amazonaws.athena=warn

# The Databricks driver, at WARN.
#
# Belt and braces rather than the actual control. The open-source driver bundles its OWN relocated
# SLF4J bound to a java.util.logging provider, so this line does not reach it - which is exactly why
# DatabricksConnectionFactory pins the driver's own LogLevel=0. That is what stops the driver writing
# a connection string containing PWD= to disk. Left here so that a future driver release which stops
# relocating SLF4J does not silently start logging at INFO.
org.slf4j.simpleLogger.log.com.databricks=warn

# The AWS SDK, at WARN. Its wire and signing logs are large and say nothing a connector operator
# needs.
org.slf4j.simpleLogger.log.software.amazon.awssdk=warn
org.slf4j.simpleLogger.log.org.apache.http=warn

# Lambda already stamps each line with a timestamp and a request id, so repeating the timestamp
# wastes bytes. The logger's name is worth having: it is how a reader tells a connector line from an
# SDK line.
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true

# stdout, not stderr: Lambda forwards both to the same log stream, and stderr makes every INFO line
# read as an error in some log viewers.
org.slf4j.simpleLogger.logFile=System.out
