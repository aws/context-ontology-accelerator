[project]
name = "coa-workflow-agents"
version = "0.3.10"
description = "Self-hosted MCP server whose agents drive COA workflows through the COA REST API with the caller's own token"
requires-python = ">=3.12"

dependencies = [
    "coa-common",
    "coa-control-plane-server",
    "botocore>=1.35.0",
    # strands.interventions (the confirmation gate in intervention.py) needs >= 1.43.0.
    "strands-agents>=1.48.0",
    "mcp>=1.30.0,<2",
    "uvicorn>=0.48.0",
    "starlette>=1.4.1",
    "requests>=2.34.2",
    "structlog>=24.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_workflow_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
]

[tool.uv.sources]
coa-common = { workspace = true }
coa-control-plane-server = { workspace = true }
