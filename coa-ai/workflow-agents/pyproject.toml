[project]
name = "coa-workflow-agents"
version = "0.3.10"
description = "Workflow agents that drive COA onboarding, induction, acceptance, ontology and metric workflows through the COA REST API"
requires-python = ">=3.12"

dependencies = [
    "coa-control-plane-server",
    "requests>=2.34.2",
    "structlog>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coa_workflow_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "integ: Integration tests",
]

[tool.uv.sources]
coa-control-plane-server = { workspace = true }
